<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chottu Chat | Login</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Poppins",sans-serif;
}

body{

height:100vh;
display:flex;
justify-content:center;
align-items:center;

background:
linear-gradient(135deg,#0f172a,#1e293b,#0f172a);

}

.container{

width:420px;
background:rgba(255,255,255,.08);

border:1px solid rgba(255,255,255,.12);

backdrop-filter:blur(20px);

padding:35px;

border-radius:20px;

box-shadow:0 20px 50px rgba(0,0,0,.4);

}

.logo{

font-size:60px;

text-align:center;

margin-bottom:15px;

}

h1{

text-align:center;

color:white;

margin-bottom:8px;

}

p{

text-align:center;

color:#cbd5e1;

margin-bottom:25px;

font-size:14px;

}

.flash{

background:#ef4444;

padding:12px;

border-radius:10px;

margin-bottom:15px;

color:white;

text-align:center;

}

.input-box{

margin-bottom:18px;

}

.input-box label{

display:block;

color:white;

margin-bottom:8px;

font-size:14px;

}

.input-box input{

width:100%;

height:50px;

padding:0 15px;

border:none;

border-radius:12px;

background:#1e293b;

color:white;

font-size:15px;

outline:none;

}

.input-box input:focus{

border:2px solid #22c55e;

}

.options{

display:flex;

justify-content:space-between;

align-items:center;

margin-bottom:20px;

font-size:14px;

}

.options label{

color:#cbd5e1;

}

.options a{

color:#22c55e;

text-decoration:none;

}

.login-btn{

width:100%;

height:50px;

border:none;

border-radius:12px;

background:#22c55e;

color:white;

font-size:16px;

font-weight:bold;

cursor:pointer;

transition:.3s;

}

.login-btn:hover{

background:#16a34a;

}

.signup{

margin-top:20px;

text-align:center;

color:#cbd5e1;

}

.signup a{

color:#22c55e;

text-decoration:none;

font-weight:bold;

}

</style>

</head>

<body>

<div class="container">

<div class="logo">
💬
</div>

<h1>Welcome Back</h1>

<p>Login to your Chottu Chat account</p>

{% with messages = get_flashed_messages(with_categories=true) %}
{% if messages %}
{% for category,message in messages %}

<div class="flash">

{{ message }}

</div>

{% endfor %}
{% endif %}
{% endwith %}

<form method="POST" action="{{ url_for('login') }}">

<div class="input-box">

<label>Username or Email</label>

<input

type="text"

name="identity"

placeholder="Enter Username or Email"

required

>

</div>

<div class="input-box">

<label>Password</label>

<input

type="password"

name="password"

placeholder="Enter Password"

required

>

</div>

<div class="options">

<label>

<input type="checkbox" name="remember">

Remember Me

</label>

<a href="{{ url_for('forgot_password') }}">Forgot Password?</a>

</div>

<button class="login-btn" type="submit">

Login

</button>

</form>

<div class="signup">

Don't have an account?

<a href="{{ url_for('signup') }}">

Create Account

</a>

</div>

</div>

</body>

</html>
