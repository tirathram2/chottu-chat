<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Welcome back · Chottu Chat</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head><body class="auth-page"><main class="auth-card"><a class="brand" href="{{ url_for('routes.home') }}"><img src="{{ url_for('static',filename='logo.png') }}" onerror="this.style.display='none'"><span>Chottu <b>Chat</b></span></a><div class="auth-copy"><h1>Welcome back</h1><p>Your conversations are waiting.</p></div>{% if error %}<div class="alert">{{ error }}</div>{% endif %}<form method="post" class="auth-form"><label>Username or email<input name="identity" autocomplete="username" required autofocus placeholder="your_name or you@example.com"></label><label>Password<input name="password" type="password" autocomplete="current-password" required placeholder="••••••••"></label><label><input name="remember" type="checkbox"> Keep me signed in</label><button class="primary" type="submit">Log in <span>→</span></button></form><p class="auth-switch">New to Chottu? <a href="{{ url_for('auth.signup') }}">Create an account</a></p></main></body></html>
