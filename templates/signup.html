<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account · Chottu Chat</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head><body class="auth-page"><main class="auth-card"><a class="brand" href="{{ url_for('routes.home') }}"><img src="{{ url_for('static',filename='logo.png') }}" onerror="this.style.display='none'"><span>Chottu <b>Chat</b></span></a><div class="auth-copy"><h1>Make it yours</h1><p>Private, lively, and wonderfully simple.</p></div>{% if error %}<div class="alert">{{ error }}</div>{% endif %}<form method="post" class="auth-form"><label>Username<input name="username" autocomplete="username" minlength="3" maxlength="32" required autofocus placeholder="your_name"></label><label>Email<input name="email" type="email" autocomplete="email" required placeholder="you@example.com"></label><label>Password<input name="password" type="password" autocomplete="new-password" minlength="8" required placeholder="at least 8 characters"></label><button class="primary" type="submit">Create account <span>→</span></button></form><p class="auth-switch">Already have an account? <a href="{{ url_for('auth.login') }}">Log in</a></p></main></body></html>
